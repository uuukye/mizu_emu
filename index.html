<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mizu_sim</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.3.4/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script>
const gridSizes = [8, 12, 18, 24];
let gridIndex = 2;
let gridSize = gridSizes[gridIndex];
let tileW = 36;
let tileH = 28;
let tileZ = 18;
let offsetY = 0;
let unwater = false;
let blockMode = 0;
let waterTimer = 0;
let totalVolume;
let menu = false;
let selection = 2;
let guide=false;

const viscosityValues = [0.02, 0.33, 1, 40, 100, 8000];
const fluidColors = [
  [185, 190, 195],
  [220, 70, 80],
  [19, 126, 157],
  [148, 160, 43],
  [178, 101, 39],
  [245, 195, 35]
];
const fluidOpacity = [110, 135, 235, 255, 255, 255];

let terrain = createTerrain(gridSize);

let water = Array.from(
  { length: gridSize },
  () => Array(gridSize).fill(0)
);

let waterVisible = Array.from(
  { length: gridSize },
  () => Array(gridSize).fill(false)
);

function createTerrain(size) {
  return Array.from({ length: size }, (_, x) =>
    Array.from({ length: size }, (_, y) => {
      const center = (size - 1) / 2;
      const dist = Math.hypot(x - center, y - center);
      return Math.min(2, Math.floor(Math.max(0, dist - 1) / (3.7 * size / 18)));
    })
  );
}

function updateGridScale() {
  const scaleW = width * 0.9 / (gridSize * 36);
  const scaleH = height * 0.72 / (gridSize * 28 + 11 * 18);
  const scale = Math.min(1, scaleW, scaleH);
  tileW = 36 * scale;
  tileH = 28 * scale;
  tileZ = 18 * scale;

  let minY = Infinity;
  let maxY = -Infinity;

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      const sy = (x + y) * tileH / 2 - (5 + terrain[x][y]) * tileZ;
      minY = Math.min(minY, sy - tileH / 2);
      maxY = Math.max(maxY, sy + tileH / 2 + (terrain[x][y] + 1) * tileZ);
    }
  }

  offsetY = height / 2 - (minY + maxY) / 2;
}

function changeGridSize() {
  gridIndex = (gridIndex + 1) % gridSizes.length;
  gridSize = gridSizes[gridIndex];
  terrain = createTerrain(gridSize);
  water = Array.from({ length: gridSize }, () => Array(gridSize).fill(0));
  waterVisible = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));
  waterTimer = 0;
  totalVolume = 0;
  updateGridScale();
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  updateGridScale();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  updateGridScale();
}

function draw() {
  totalVolume = waterVolume();
  updateWater(Math.min(deltaTime, 50));
  updateVis();
  background(0);

  push();
  translate(width / 2, offsetY);

  for (let sum = 0; sum < gridSize * 2 - 1; sum++) {
    for (let x = 0; x < gridSize; x++) {
      const y = sum - x;
      if (y < 0 || y >= gridSize) continue;

      drawMap(x, y, 5);

      if (waterVisible[x][y]) {
        drawWater(x, y, water[x][y], 5);
      }
    }
  }

  const hovered = findTile(mouseX, mouseY);
  if (hovered) {
    tileHighlight(hovered.x, hovered.y);
  }

  pop();

  noStroke();
  fill(180);
  textSize(19);
    fill(200,50,255);
  if (blockMode === 1) {
    text("You are currently in BUILD mode: click/drag to add blocks.", 16, 50);
  } else if (blockMode === 2) {
    text("You are currently in DELETE mode: click/drag to remove blocks.", 16, 50);
  } else if (unwater) {
    text("You are currently in SPONGE mode: click/drag to absorb fluid.", 16, 50);
  } else {
    text("You are currently in WATER mode: click/drag to pour fluid.", 16, 50);
  }
  text("water volume: " + floor(totalVolume * 10) / 10 + " units", 16, 80);

  if(guide){
  fill(255);

  text("SPACE: clear water", 16, 110);
  text("R: Reset terrain", 16, 140);
  text("G: Change grid size ("+gridSize+"x"+gridSize+"), will reset all", 16, 170);
  text("M: Change viscosity (Change fluid)", 16, 220);
  text("B: Build blocks on terrain", 16, 250);
  text("D: Delete blocks on terrain", 16, 280);
  text("U: Absorb fluid", 16, 310);
  text("W: Pour fluid", 16, 340);
  }
  else{
  text("Press A for guide", 16, 110);
  }

  text("mizu emu - by @ninew - crescent hackclub - emulator", width-370, height-20);
  if (menu) {
    drawCube(width-260, 230, 20, fluidColors[selection]);

    if (selection === 0) {
      text("liquid hydrogen", width-200, 210);
      textSize(15);
      text("viscosity multiplier: 0.02x", width-200, 230);
    } else if (selection === 1) {
      text("acetone", width-200, 210);
      textSize(15);
      text("viscosity multiplier: 0.33x", width-200, 230);
    } else if (selection === 2) {
      text("water", width-200, 210);
      textSize(15);
      text("viscosity multiplier: 1x", width-200, 230);
    } else if (selection === 3) {
      text("olive oil", width-200, 210);
      textSize(15);
      text("viscosity multiplier: 40x", width-200, 230);
    } else if (selection === 4) {
      text("maple syrup", width-200, 210);
      textSize(15);
      text("viscosity multiplier: 100x", width-200, 230);
    } else if (selection === 5) {
      text("honey", width-200, 210);
      textSize(15);
      text("viscosity multiplier: 8000x",width-200, 230);
    }
  }
}

function updateWater(dt) {
  waterTimer += dt;

  while (waterTimer >= 80) {
    waterTimer -= 80;
    makeWater();
  }
}

function updateVis() {
  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      if (waterVisible[x][y]) {
        if (water[x][y] < 0.0005) {
          waterVisible[x][y] = false;
        }
      } else if (water[x][y] > 0.008) {
        waterVisible[x][y] = true;
      }
    }
  }
}

function outlets(x, y) {
  const surface = terrain[x][y] + water[x][y];
  const neighbors = [
    [x - 1, y],
    [x + 1, y],
    [x, y - 1],
    [x, y + 1]
  ];

  let count = 0;

  for (const [nx, ny] of neighbors) {
    if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) {
      continue;
    }

    if (surface - terrain[nx][ny] - water[nx][ny] > 0.01) {
      count++;
    }
  }

  return Math.max(1, count);
}

function moveWater(transfers, outgoing, x, y, nx, ny) {
  if (nx >= gridSize || ny >= gridSize) return;

  const difference =
    terrain[x][y] + water[x][y] -
    terrain[nx][ny] - water[nx][ny];

  let sx, sy, dx, dy, drop;

  if (difference > 0.01 && water[x][y] > 0.000001) {
    sx = x;
    sy = y;
    dx = nx;
    dy = ny;
    drop = difference;
  } else if (difference < -0.01 && water[nx][ny] > 0.000001) {
    sx = nx;
    sy = ny;
    dx = x;
    dy = y;
    drop = -difference;
  } else {
    return;
  }

  const count = outlets(sx, sy);
  const viscosity = Math.max(0.02, viscosityValues[selection]);
  const flowRate = 0.08 / Math.sqrt(viscosity);

  const amount = Math.min(
    water[sx][sy] * 0.9,
    drop * flowRate * (4 / count)
  );

  if (amount <= 0) return;

  transfers.push({ sx, sy, dx, dy, amount });
  outgoing[sx][sy] += amount;
}

function makeWater() {
  const transfers = [];
  
  const outgoing = Array.from(
    { length: gridSize },
    () => Array(gridSize).fill(0)
  );

  const changes = Array.from(
    { length: gridSize },
    () => Array(gridSize).fill(0)
  );

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      moveWater(transfers, outgoing, x, y, x + 1, y);
      moveWater(transfers, outgoing, x, y, x, y + 1);
    }
  }

  for (const transfer of transfers) {
    const { sx, sy, dx, dy } = transfer;
    const limit = water[sx][sy] * 0.9;

    const scale = outgoing[sx][sy] > limit
      ? limit / outgoing[sx][sy]
      : 1;

    const amount = transfer.amount * scale;

    changes[sx][sy] -= amount;
    changes[dx][dy] += amount;
  }

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      water[x][y] = Math.max(0, water[x][y] + changes[x][y]);

      if (water[x][y] < 0.000001) {
        water[x][y] = 0;
      }
    }
  }
}

function mousePressed() {
  tile();
  return false;
}

function mouseDragged() {
  tile();
  return false;
}

function findTile(px, py) {
  const mx = px - width / 2;
  const my = py - offsetY;

  let selected = null;
  let closest = 999999;

  for (let sum = 0; sum < gridSize * 2 - 1; sum++) {
    for (let x = 0; x < gridSize; x++) {
      const y = sum - x;
      if (y < 0 || y >= gridSize) continue;

      const sx = (x - y) * tileW / 2;
      const groundSy = (x + y) * tileH / 2 - (5 + terrain[x][y]) * tileZ;
      const waterSy = groundSy - water[x][y] * tileZ;

      const groundDist =
        Math.abs(mx - sx) / (tileW / 2) +
        Math.abs(my - groundSy) / (tileH / 2);

      const waterDist =
        Math.abs(mx - sx) / (tileW / 2) +
        Math.abs(my - waterSy) / (tileH / 2);

      const dist = Math.min(groundDist, waterDist);

      if (dist <= 1.03 && dist < closest) {
        closest = dist;
        selected = { x, y };
      }
    }
  }

  return selected;
}

function tile() {
  const selected = findTile(mouseX, mouseY);
  if (!selected) return;

  const { x, y } = selected;

  if (blockMode === 1) {
    terrain[x][y] = Math.min(6, terrain[x][y] + 1);
    updateGridScale();
  } else if (blockMode === 2) {
    terrain[x][y] = Math.max(0, terrain[x][y] - 1);
    updateGridScale();
  } else if (!unwater) {
    water[x][y] = Math.min(3.5, water[x][y] + 1);
  } else {
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;

        let amount = 0.1;

        if (dx === 0 && dy === 0) {
          amount = 1.2;
        } else if (dx === 0 || dy === 0) {
          amount = 0.35;
        }

        water[nx][ny] = Math.max(0, water[nx][ny] - amount);
      }
    }
  }
}

function tileHighlight(x, y) {
  const sx = (x - y) * tileW / 2;
  const sy = (x + y) * tileH / 2 - (5 + terrain[x][y]) * tileZ;
  const w = tileW / 2;
  const h = tileH / 2;

  noFill();
  strokeWeight(3);

  if (blockMode === 1) {
    stroke(80, 255, 120);
  } else if (blockMode === 2) {
    stroke(255, 90, 90);
  } else {
    stroke(255, 230, 100);
  }

  quad(
    sx, sy - h,
    sx + w, sy,
    sx, sy + h,
    sx - w, sy
  );

  strokeWeight(1);
}

function drawWater(x, y, amount, z) {
  const elevation = terrain[x][y];
  const surface = elevation + amount;

  const sx = (x - y) * tileW / 2;
  const sy = (x + y) * tileH / 2 - (z + surface) * tileZ;

  const w = tileW / 2;
  const h = tileH / 2;

  const fluidColor = fluidColors[selection];
  const alpha = Math.min(fluidOpacity[selection], 95 + amount * 45);

  const rightSurface = x < gridSize - 1
    ? terrain[x + 1][y] + (waterVisible[x + 1][y] ? water[x + 1][y] : 0)
    : elevation;

  const leftSurface = y < gridSize - 1
    ? terrain[x][y + 1] + (waterVisible[x][y + 1] ? water[x][y + 1] : 0)
    : elevation;

  const rightDrop = surface - rightSurface;
  const leftDrop = surface - leftSurface;

  noStroke();

  if (leftDrop > 0.0001) {
    const depth = leftDrop * tileZ;

    fill(fluidColor[0] * 0.42, fluidColor[1] * 0.42, fluidColor[2] * 0.42, alpha);

    quad(
      sx - w, sy,
      sx, sy + h,
      sx, sy + h + depth,
      sx - w, sy + depth
    );
  }

  if (rightDrop > 0.0001) {
    const depth = rightDrop * tileZ;

    fill(fluidColor[0] * 0.62, fluidColor[1] * 0.62, fluidColor[2] * 0.62, alpha);

    quad(
      sx, sy + h,
      sx + w, sy,
      sx + w, sy + depth,
      sx, sy + h + depth
    );
  }

  fill(fluidColor[0], fluidColor[1], fluidColor[2], alpha);

  quad(
    sx, sy - h,
    sx + w, sy,
    sx, sy + h,
    sx - w, sy
  );

  if (amount > 0.25) {
    stroke(
      Math.min(255, fluidColor[0] + 55),
      Math.min(255, fluidColor[1] + 55),
      Math.min(255, fluidColor[2] + 55),
      Math.min(alpha, amount * 55)
    );

    strokeWeight(1);

    line(
      sx - w * 0.3,
      sy - h * 0.08,
      sx + w * 0.15,
      sy - h * 0.08
    );

    noStroke();
  }
}

function fillRgb(color) {
  fill(color[0], color[1], color[2]);
}

function drawCube(x, y, size, color) {
  const alpha = fluidOpacity[selection];

  noStroke();

  fill(
    Math.min(255, color[0] * 1.18),
    Math.min(255, color[1] * 1.18),
    Math.min(255, color[2] * 1.18),
    alpha
  );

  quad(
    x, y - size * 0.65,
    x + size, y - size * 0.15,
    x, y + size * 0.35,
    x - size, y - size * 0.15
  );

  fill(color[0] * 0.62, color[1] * 0.62, color[2] * 0.62, alpha);

  quad(
    x - size, y - size * 0.15,
    x, y + size * 0.35,
    x, y + size * 1.15,
    x - size, y + size * 0.65
  );

  fill(color[0] * 0.82, color[1] * 0.82, color[2] * 0.82, alpha);

  quad(
    x, y + size * 0.35,
    x + size, y - size * 0.15,
    x + size, y + size * 0.65,
    x, y + size * 1.15
  );
}

function waterVolume() {
  let volume = 0;

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      volume += water[x][y];
    }
  }

  return volume;
}

function drawMap(x, y, z) {
  const elevation = terrain[x][y];
  const level = elevation % 4;

  const topColors = [
    [97, 24, 20],
    [94, 12, 30],
    [87, 6, 23],
    [79, 25, 5]
  ];

  const leftColors = [
    [92, 14, 10],
    [84, 2, 20],
    [74, 2, 13],
    [61, 15, 2]
  ];

  const rightColors = [
    [82, 4, 0],
    [74, 2, 10],
    [64, 2, 3],
    [51, 5, 2]
  ];

  const sx = (x - y) * tileW / 2;
  const sy = (x + y) * tileH / 2 - (z + elevation) * tileZ;

  const w = tileW / 2;
  const h = tileH / 2;
  const depth = (elevation + 1) * tileZ;

  stroke(10);
  strokeWeight(1);

  fillRgb(topColors[level]);

  quad(
    sx, sy - h,
    sx + w, sy,
    sx, sy + h,
    sx - w, sy
  );

  fillRgb(leftColors[level]);

  quad(
    sx - w, sy,
    sx, sy + h,
    sx, sy + h + depth,
    sx - w, sy + depth
  );

  fillRgb(rightColors[level]);

  quad(
    sx, sy + h,
    sx + w, sy,
    sx + w, sy + depth,
    sx, sy + h + depth
  );
}

function keyPressed(event) {
  if (event.repeat) return;

  if (event.code === "KeyB") {
    blockMode = 1;
  } else if (event.code === "KeyD") {
    blockMode = 2;
  } else if (event.code === "KeyU") {
    blockMode = 0;
    unwater = true;
  } else if (event.code === "KeyW") {
    blockMode = 0;
    unwater = false;
  } else if (event.code === "KeyR") {
    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize; y++) {
        const center = (gridSize - 1) / 2;
        const dist = Math.hypot(x - center, y - center);

        terrain[x][y] = Math.min(2, Math.floor(Math.max(0, dist - 1) / (3.7 * gridSize / 18)));
        water[x][y] = 0;
        waterVisible[x][y] = false;
      }
    }

    waterTimer = 0;
    blockMode = 0;
    unwater = false;
    updateGridScale();
  } else if (event.code === "Space") {
    event.preventDefault();

    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize; y++) {
        water[x][y] = 0;
        waterVisible[x][y] = false;
      }
    }
  } else if (event.code === "KeyG") {
    changeGridSize();
  } else if (event.code === "KeyM") {
    menu = !menu;
  } else if (event.code === "ArrowRight" && menu) {
    selection = (selection + 1) % 6;
  } else if (event.code === "ArrowLeft" && menu) {
    selection = (selection + 5) % 6;
  } else if (event.code === "KeyA"){
    guide=!guide;
  }
}
</script>
</body>
