<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mizu_sim</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.3.4/p5.min.js"></script>
  <style>

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      display: block;
    }

  </style>
</head>
<body>
<script>
const gridSize = 18;
const tileW = 36;
const tileH = 28;
const tileZ = 18;

let unwater = false;
let blockMode = 0;
let waterTimer = 0;
let totalVolume;

const terrain = Array.from({ length: gridSize }, (_, x) =>
  Array.from({ length: gridSize }, (_, y) => {
    const center = (gridSize - 1) / 2;
    const dist = Math.hypot(x - center, y - center);
    return Math.min(2, Math.floor(Math.max(0, dist - 1) / 3.7));
  })
);

let water = Array.from(
  { length: gridSize },
  () => Array(gridSize).fill(0)
);

function setup() {
  createCanvas(windowWidth, windowHeight);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function draw() {
totalVolume = waterVolume();
  updateWater(Math.min(deltaTime, 50));
  background(0);

  push();
  translate(width / 2, height / 2 - 30);

  for (let sum = 0; sum < gridSize * 2 - 1; sum++) {
    for (let x = 0; x < gridSize; x++) {
      const y = sum - x;
      if (y < 0 || y >= gridSize) continue;

      drawMap(x, y, 5);

      if (water[x][y] > 0.015) {
        drawWater(x, y, water[x][y], 5);
        drawWaterfall(x, y);
      }
    }
  }

  const hovered = findTile(mouseX, mouseY);
  if (hovered) {
    drawTileHighlight(hovered.x, hovered.y);
  }

  pop();

  noStroke();
  fill(180);
  textSize(13);

if (blockMode === 1) {
  text("BUILD mode: click/drag to add blocks. Press D for DELETE, W for WATER, or U for SPONGE.", 16, 24);
} else if (blockMode === 2) {
  text("DELETE mode: click/drag to remove blocks. Press B for BUILD, W for WATER, or U for SPONGE.", 16, 24);
} else if (unwater) {
  text("SPONGE mode: click/drag to absorb water. Press W for WATER, B for BUILD, or D for DELETE.", 16, 24);
} else {
  text("WATER mode: click/drag to pour water. Press U for SPONGE, B for BUILD, or D for DELETE.", 16, 24);
}

text("SPACE: clear water    R: reset terrain", 16, 44);
text("there is "+totalVolume+" cubic meters of water", 16, 64);
text( )

  text("mizu emu - by @ninew - crescent hackclub - emulator", width-350, height-20);
}

function updateWater(dt) {
  waterTimer += dt;
  while (waterTimer >= 80) {
    waterTimer -= 80;
    makeWater();
  }
}

function moveWater(changes, x, y, nx, ny) {
  if (nx >= gridSize || ny >= gridSize) return;

  const difference =
    terrain[x][y] + water[x][y] -
    terrain[nx][ny] - water[nx][ny];

  if (difference > 0.01 && water[x][y] > 0.0001) {
    const amount = Math.min(water[x][y] * 0.08, difference * 0.035);
    changes[x][y] -= amount;
    changes[nx][ny] += amount;
  } else if (difference < -0.01 && water[nx][ny] > 0.0001) {
    const amount = Math.min(water[nx][ny] * 0.08, -difference * 0.035);
    changes[nx][ny] -= amount;
    changes[x][y] += amount;
  }
}

function makeWater() {
  const changes = Array.from(
    { length: gridSize },
    () => Array(gridSize).fill(0)
  );

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      moveWater(changes, x, y, x + 1, y);
      moveWater(changes, x, y, x, y + 1);
    }
  }

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      water[x][y] = Math.max(0, water[x][y] + changes[x][y]);

      if (water[x][y] < 0.00001) {
        water[x][y] = 0;
      }
    }
  }
}

function mousePressed() {
  tile();
  return false;
}

function mouseDragged() {
  tile();
  return false;
}

function findTile(px, py) {
  const mx = px - width / 2;
  const my = py - (height / 2 - 30);

  let selected = null;
  let closest = 999999;

  for (let sum=0; sum<gridSize*2-1; sum++) {
    for (let x = 0; x < gridSize; x++) {
      const y = sum - x;
      if (y < 0 || y >= gridSize) continue;

      const sx = (x-y) * tileW / 2;
      const groundSy = (x+y) * tileH / 2 - (5 + terrain[x][y]) * tileZ;
      const waterSy = groundSy - water[x][y] * tileZ;

      const groundDist=
        Math.abs(mx-sx)/(tileW/2) +
        Math.abs(my-groundSy) / (tileH/2);

      const waterDist=
        Math.abs(mx-sx)/(tileW/2) +
        Math.abs(my-waterSy)/(tileH/2);

      const dist = Math.min(groundDist, waterDist);

      if (dist<=1.03&&dist<closest) {
        closest=dist;
        selected={x,y};
      }
    }
  }

  return selected;
}

function tile() {
  const selected = findTile(mouseX, mouseY);
  if (!selected) return;

  const { x, y } = selected;

  if (blockMode === 1) {
    terrain[x][y] = Math.min(6, terrain[x][y] + 1);
  } else if (blockMode === 2) {
    terrain[x][y] = Math.max(0, terrain[x][y] - 1);
  } else if (!unwater) {
    water[x][y] = Math.min(3.5, water[x][y] + 0.8);
  } else {
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;

        let amount = 0.1;

        if (dx === 0 && dy === 0) {
          amount = 1.2;
        } else if (dx === 0 || dy === 0) {
          amount = 0.35;
        }

        water[nx][ny] = Math.max(0, water[nx][ny] - amount);
      }
    }
  }
}

function drawTileHighlight(x, y) {
  const sx = (x - y) * tileW / 2;
  const sy =
    (x + y) * tileH / 2 - (5 + terrain[x][y]) * tileZ;
  const w = tileW / 2;
  const h = tileH / 2;

  noFill();
  strokeWeight(3);

  if (blockMode === 1) {
    stroke(80, 255, 120);
  } else if (blockMode === 2) {
    stroke(255, 90, 90);
  } else {
    stroke(255, 230, 100);
  }

  quad(
    sx, sy - h,
    sx + w, sy,
    sx, sy + h,
    sx - w, sy
  );

  strokeWeight(1);
}

function drawWater(x, y, amount, z) {
  const elevation = terrain[x][y];
  const sx = (x - y) * tileW / 2;
  const groundSy =
    (x + y) * tileH / 2 - (z + elevation) * tileZ;
  const depth = amount * tileZ;
  const sy = groundSy - depth;

  const w = tileW / 2;
  const h = tileH / 2;
  const alpha = Math.min(235, 95 + amount * 45);

  stroke(9, 47, 61);
  strokeWeight(1);

  fill(9, 70, 91, alpha);
  quad(
    sx - w, sy,
    sx, sy + h,
    sx, sy + h + depth,
    sx - w, sy + depth
  );

  fill(11, 93, 118, alpha);
  quad(
    sx, sy + h,
    sx + w, sy,
    sx + w, sy + depth,
    sx, sy + h + depth
  );

  fill(19, 126, 157, alpha);
  beginShape();
  vertex(sx, sy - h);
  vertex(sx + w, sy);
  vertex(sx, sy + h);
  vertex(sx - w, sy);
  endShape(CLOSE);

  if (amount > 0.25) {
    stroke(117, 203, 218, Math.min(180, amount * 55));
    strokeWeight(1);
    line(
      sx - w * 0.3,
      sy - h * 0.08,
      sx + w * 0.15,
      sy - h * 0.08
    );
  }
}

function drawWaterfall(x, y) {
  const amount=water[x][y];
  if (amount<=0.015) return;

  const sourceSurface = terrain[x][y] + amount;
  const sx = (x-y) * tileW / 2;
  const w = tileW / 2;
  const h = tileH / 2;

  const adjs = [
    { x: x + 1, y, side: "right" },
    { x, y: y + 1, side: "left" }
  ];

  for (const adj of adjs) {
    if (adj.x >= gridSize || adj.y >= gridSize) continue;
    if (terrain[x][y] <= terrain[adj.x][adj.y]) continue;

    const neighborSurface =
      terrain[adj.x][adj.y] + water[adj.x][adj.y];
    const drop = sourceSurface - neighborSurface;
    if (drop <= 0.03) continue;

    const topY =
      (x + y) * tileH / 2 - (5 + sourceSurface) * tileZ;
    const bottomY = drop * tileZ;

    noStroke();
    fill(25, 145, 175, 220);

    if (adj.side === "right") {
      quad(
        sx+w, topY,
        sx, topY+h,
        sx, topY+h+bottomY,
        sx+w, topY+bottomY
      );
    } else {
      quad(
        sx-w, topY,
        sx, topY+h,
        sx, topY+h+bottomY,
        sx-w, topY+bottomY
      );
    }
  }
}

function fillRgb(color) {
  fill(color[0], color[1], color[2]);
}

function waterVolume() {
  let volume = 0;

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      volume += water[x][y];
    }
  }

  return volume;
}


function drawMap(x, y, z) {
  const elevation = terrain[x][y];
  const level = elevation % 4;

  const topColors = [
    [97, 24, 20],
    [94, 12, 30],
    [87, 6, 23],
    [79, 25, 5]
  ];

  const leftColors = [
    [92, 14, 10],
    [84, 2, 20],
    [74, 2, 13],
    [61, 15, 2]
  ];

  const rightColors = [
    [82, 4, 0],
    [74, 2, 10],
    [64, 2, 3],
    [51, 5, 2]
  ];

  const sx = (x - y) * tileW/2;
  const sy = (x + y) * tileH/2-(z+elevation)*tileZ;
  const w = tileW/2;
  const h = tileH/2;
  const depth = (elevation+1)*tileZ;

  stroke(10);
  strokeWeight(1);

  fillRgb(topColors[level]);
  beginShape();
  vertex(sx, sy - h);
  vertex(sx + w, sy);
  vertex(sx, sy + h);
  vertex(sx - w, sy);
  endShape(CLOSE);

  fillRgb(leftColors[level]);
  beginShape();
  vertex(sx - w, sy);
  vertex(sx, sy + h);
  vertex(sx, sy + h + depth);
  vertex(sx - w, sy + depth);
  endShape(CLOSE);

  fillRgb(rightColors[level]);
  beginShape();
  vertex(sx, sy + h);
  vertex(sx + w, sy);
  vertex(sx + w, sy + depth);
  vertex(sx, sy + h + depth);
  endShape(CLOSE);
}

function keyPressed(event) {
  if (event.repeat) return;

  if (event.code === "KeyB") {
    blockMode = 1;
  } else if (event.code === "KeyD") {
    blockMode = 2;
  } else if (event.code === "KeyU") {
    blockMode = 0;
    unwater = true;
  } else if (event.code === "KeyW") {
    blockMode = 0;
    unwater = false;
  } else if (event.code === "KeyR") {
    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize; y++) {
        const center = (gridSize - 1) / 2;
        const dist = Math.hypot(x - center, y - center);

        terrain[x][y] = Math.min(2, Math.floor(Math.max(0, dist - 1) / 3.7));
        water[x][y] = 0;
      }
    }

    waterTimer = 0;
    blockMode = 0;
    unwater = false;
  } else if (event.code === "Space") {
    event.preventDefault();

    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize; y++) {
        water[x][y] = 0;
      }
    }
  }
}
</script>
</body>
</html>
