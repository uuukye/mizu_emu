<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mizu_sim</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.3.4/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script>
const gridSize = 18;
const tileW = 36;
const tileH = 28;
const tileZ = 18;

let unwater = false;
let blockMode = 0;
let waterTimer = 0;
let totalVolume;
let menu=false;
let selection=2;
let unpress=true;

const terrain = Array.from({ length: gridSize }, (_, x) =>
  Array.from({ length: gridSize }, (_, y) => {
    const center = (gridSize - 1) / 2;
    const dist = Math.hypot(x - center, y - center);
    return Math.min(2, Math.floor(Math.max(0, dist - 1) / 3.7));
  })
);

let water = Array.from(
  { length: gridSize },
  () => Array(gridSize).fill(0)
);

let waterVisible = Array.from(
  { length: gridSize },
  () => Array(gridSize).fill(false)
);

function setup() {
  createCanvas(windowWidth, windowHeight);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function draw() {
  totalVolume = waterVolume();
  updateWater(Math.min(deltaTime, 50));
  updateVis();
  background(0);

  push();
  translate(width / 2, height / 2 - 30);

  for (let sum = 0; sum < gridSize * 2 - 1; sum++) {
    for (let x = 0; x < gridSize; x++) {
      const y = sum - x;
      if (y < 0 || y >= gridSize) continue;

      drawMap(x, y, 5);

      if (waterVisible[x][y]) {
        drawWater(x, y, water[x][y], 5);
      }
    }
  }

  const hovered = findTile(mouseX, mouseY);
  if (hovered) {
    tileHighlight(hovered.x, hovered.y);
  }

  pop();

  noStroke();
  fill(180);
  textSize(15);

  if (blockMode === 1) {
    text("BUILD mode: click/drag to add blocks. Press D for DELETE, W for WATER, or U for SPONGE.", 16, 20);
  } else if (blockMode === 2) {
    text("DELETE mode: click/drag to remove blocks. Press B for BUILD, W for WATER, or U for SPONGE.", 16, 20);
  } else if (unwater) {
    text("SPONGE mode: click/drag to absorb water. Press W for WATER, B for BUILD, or D for DELETE.", 16, 20);
  } else {
    text("WATER mode: click/drag to pour water. Press U for SPONGE, B for BUILD, or D for DELETE.", 16, 20);
  }

  text("SPACE: clear water    R: reset terrain", 16, 40);
  text("there is " + floor(totalVolume * 10) / 10 + " cubic meters of water", 16, 60);
  text("Press M to change viscosity", 16, 100);

  text("mizu emu - by @ninew - crescent hackclub - emulator", width - 350, height - 20);
  
  if(menu){
    if(selection==0){
    text("liquid hydrogen", windowWidth/2, 140);
    textSize(10);
    text("viscosity multiplier: 0.02x", windowWidth/2, 155);
    text("let the whole temperature be -253 degrees C", windowWidth/2, 168);
    }else if(selection==1){
    text("acetone", windowWidth/2, 140);
    textSize(10);
    text("viscosity multiplier: 0.33x", windowWidth/2, 155);
    }else if(selection==2){
    text("water", windowWidth/2, 140);
    textSize(10);
    text("viscosity multiplier: 1x", windowWidth/2, 155);
    }else if(selection==3){
    text("olive oil", windowWidth/2, 140);
    textSize(10);
    text("viscosity multiplier: 40x", windowWidth/2, 155);
    }else if(selection==3){
    text("maple syrup", windowWidth/2, 140);
    textSize(10);
    text("viscosity multiplier: 100x", windowWidth/2, 155);
    }else if(selection==3){
    text("honey", windowWidth/2, 140);
    textSize(10);
    text("viscosity multiplier: 8000x", windowWidth/2, 155);
    }
  }
}

function updateWater(dt) {
  waterTimer += dt;

  while (waterTimer >= 80) {
    waterTimer -= 80;
    makeWater();
  }
}

function updateVis() {
  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      if (waterVisible[x][y]) {
        if (water[x][y] < 0.0005) {
          waterVisible[x][y] = false;
        }
      } else if (water[x][y] > 0.008) {
        waterVisible[x][y] = true;
      }
    }
  }
}

function outlets(x, y) {
  const surface = terrain[x][y] + water[x][y];
  const neighbors = [
    [x - 1, y],
    [x + 1, y],
    [x, y - 1],
    [x, y + 1]
  ];

  let count = 0;

  for (const [nx, ny] of neighbors) {
    if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) {
      continue;
    }

    if (surface - terrain[nx][ny] - water[nx][ny] > 0.01) {
      count++;
    }
  }

  return Math.max(1, count);
}

function moveWater(transfers, outgoing, x, y, nx, ny) {
  if (nx >= gridSize || ny >= gridSize) return;

  const difference =
    terrain[x][y] + water[x][y] -
    terrain[nx][ny] - water[nx][ny];

  let sx, sy, dx, dy, drop;

  if (difference > 0.01 && water[x][y] > 0.000001) {
    sx = x;
    sy = y;
    dx = nx;
    dy = ny;
    drop = difference;
  } else if (difference < -0.01 && water[nx][ny] > 0.000001) {
    sx = nx;
    sy = ny;
    dx = x;
    dy = y;
    drop = -difference;
  } else {
    return;
  }

  const count = outlets(sx, sy);
  const amount = Math.min(
    water[sx][sy] * 0.9,
    drop * 0.08 * (4 / count)
  );

  if (amount <= 0) return;

  transfers.push({ sx, sy, dx, dy, amount });
  outgoing[sx][sy] += amount;
}

function makeWater() {
  const transfers = [];

  const outgoing = Array.from(
    { length: gridSize },
    () => Array(gridSize).fill(0)
  );

  const changes = Array.from(
    { length: gridSize },
    () => Array(gridSize).fill(0)
  );

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      moveWater(transfers, outgoing, x, y, x + 1, y);
      moveWater(transfers, outgoing, x, y, x, y + 1);
    }
  }

  for (const transfer of transfers) {
    const { sx, sy, dx, dy } = transfer;
    const limit = water[sx][sy] * 0.9;

    const scale = outgoing[sx][sy] > limit
      ? limit / outgoing[sx][sy]
      : 1;

    const amount = transfer.amount * scale;

    changes[sx][sy] -= amount;
    changes[dx][dy] += amount;
  }

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      water[x][y] = Math.max(0, water[x][y] + changes[x][y]);

      if (water[x][y] < 0.000001) {
        water[x][y] = 0;
      }
    }
  }
}

function mousePressed() {
  tile();
  return false;
}

function mouseDragged() {
  tile();
  return false;
}

function findTile(px, py) {
  const mx = px - width / 2;
  const my = py - (height / 2 - 30);

  let selected = null;
  let closest = 999999;

  for (let sum = 0; sum < gridSize * 2 - 1; sum++) {
    for (let x = 0; x < gridSize; x++) {
      const y = sum - x;
      if (y < 0 || y >= gridSize) continue;

      const sx = (x - y) * tileW / 2;
      const groundSy = (x + y) * tileH / 2 - (5 + terrain[x][y]) * tileZ;
      const waterSy = groundSy - water[x][y] * tileZ;

      const groundDist =
        Math.abs(mx - sx) / (tileW / 2) +
        Math.abs(my - groundSy) / (tileH / 2);

      const waterDist =
        Math.abs(mx - sx) / (tileW / 2) +
        Math.abs(my - waterSy) / (tileH / 2);

      const dist = Math.min(groundDist, waterDist);

      if (dist <= 1.03 && dist < closest) {
        closest = dist;
        selected = { x, y };
      }
    }
  }

  return selected;
}

function tile() {
  const selected = findTile(mouseX, mouseY);
  if (!selected) return;

  const { x, y } = selected;

  if (blockMode === 1) {
    terrain[x][y] = Math.min(6, terrain[x][y] + 1);
  } else if (blockMode === 2) {
    terrain[x][y] = Math.max(0, terrain[x][y] - 1);
  } else if (!unwater) {
    water[x][y] = Math.min(3.5, water[x][y] + 1);
  } else {
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const nx = x + dx;
        const ny = y + dy;

        if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;

        let amount = 0.1;

        if (dx === 0 && dy === 0) {
          amount = 1.2;
        } else if (dx === 0 || dy === 0) {
          amount = 0.35;
        }

        water[nx][ny] = Math.max(0, water[nx][ny] - amount);
      }
    }
  }
}

function tileHighlight(x, y) {
  const sx = (x - y) * tileW / 2;
  const sy = (x + y) * tileH / 2 - (5 + terrain[x][y]) * tileZ;
  const w = tileW / 2;
  const h = tileH / 2;

  noFill();
  strokeWeight(3);

  if (blockMode === 1) {
    stroke(80, 255, 120);
  } else if (blockMode === 2) {
    stroke(255, 90, 90);
  } else {
    stroke(255, 230, 100);
  }

  quad(
    sx, sy - h,
    sx + w, sy,
    sx, sy + h,
    sx - w, sy
  );

  strokeWeight(1);
}

function drawWater(x, y, amount, z) {
  const elevation = terrain[x][y];
  const surface = elevation + amount;

  const sx = (x - y) * tileW / 2;
  const sy = (x + y) * tileH / 2 - (z + surface) * tileZ;

  const w = tileW / 2;
  const h = tileH / 2;
  const alpha = Math.min(235, 95 + amount * 45);

  const rightSurface = x < gridSize - 1
    ? terrain[x + 1][y] + (waterVisible[x + 1][y] ? water[x + 1][y] : 0)
    : elevation;

  const leftSurface = y < gridSize - 1
    ? terrain[x][y + 1] + (waterVisible[x][y + 1] ? water[x][y + 1] : 0)
    : elevation;

  const rightDrop = surface - rightSurface;
  const leftDrop = surface - leftSurface;

  noStroke();

  if (leftDrop > 0.0001) {
    const depth = leftDrop * tileZ;

    fill(9, 70, 91, alpha);
    quad(
      sx - w, sy,
      sx, sy + h,
      sx, sy + h + depth,
      sx - w, sy + depth
    );
  }

  if (rightDrop > 0.0001) {
    const depth = rightDrop * tileZ;

    fill(11, 93, 118, alpha);
    quad(
      sx, sy + h,
      sx + w, sy,
      sx + w, sy + depth,
      sx, sy + h + depth
    );
  }

  fill(19, 126, 157, alpha);
  quad(
    sx, sy - h,
    sx + w, sy,
    sx, sy + h,
    sx - w, sy
  );

  if (amount > 0.25) {
    stroke(117, 203, 218, Math.min(180, amount * 55));
    strokeWeight(1);

    line(
      sx - w * 0.3,
      sy - h * 0.08,
      sx + w * 0.15,
      sy - h * 0.08
    );

    noStroke();
  }
}

function fillRgb(color) {
  fill(color[0], color[1], color[2]);
}

function waterVolume() {
  let volume = 0;

  for (let x = 0; x < gridSize; x++) {
    for (let y = 0; y < gridSize; y++) {
      volume += water[x][y];
    }
  }

  return volume;
}

function drawMap(x, y, z) {
  const elevation = terrain[x][y];
  const level = elevation % 4;

  const topColors = [
    [97, 24, 20],
    [94, 12, 30],
    [87, 6, 23],
    [79, 25, 5]
  ];

  const leftColors = [
    [92, 14, 10],
    [84, 2, 20],
    [74, 2, 13],
    [61, 15, 2]
  ];

  const rightColors = [
    [82, 4, 0],
    [74, 2, 10],
    [64, 2, 3],
    [51, 5, 2]
  ];

  const sx = (x - y) * tileW / 2;
  const sy = (x + y) * tileH / 2 - (z + elevation) * tileZ;
  const w = tileW / 2;
  const h = tileH / 2;
  const depth = (elevation + 1) * tileZ;

  stroke(10);
  strokeWeight(1);

  fillRgb(topColors[level]);
  quad(
    sx, sy - h,
    sx + w, sy,
    sx, sy + h,
    sx - w, sy
  );

  fillRgb(leftColors[level]);
  quad(
    sx - w, sy,
    sx, sy + h,
    sx, sy + h + depth,
    sx - w, sy + depth
  );

  fillRgb(rightColors[level]);
  quad(
    sx, sy + h,
    sx + w, sy,
    sx + w, sy + depth,
    sx, sy + h + depth
  );
}

function keyPressed(event) {
  if (event.repeat) return;

  if (event.code === "KeyB") {
    blockMode = 1;
  } else if (event.code === "KeyD") {
    blockMode = 2;
  } else if (event.code === "KeyU") {
    blockMode = 0;
    unwater = true;
  } else if (event.code === "KeyW") {
    blockMode = 0;
    unwater = false;
  } else if (event.code === "KeyR") {
    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize; y++) {
        const center = (gridSize - 1) / 2;
        const dist = Math.hypot(x - center, y - center);

        terrain[x][y] = Math.min(2, Math.floor(Math.max(0, dist - 1) / 3.7));
        water[x][y] = 0;
        waterVisible[x][y] = false;
      }
    }

    waterTimer = 0;
    blockMode = 0;
    unwater = false;
  } else if (event.code === "Space") {
    event.preventDefault();

    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize; y++) {
        water[x][y] = 0;
        waterVisible[x][y] = false;
      }
    }
  } else if (event.code === "KeyM"){
    menu=!menu;
    selection=0;
  } else if (event.code === "ArrowRight"&&menu&&unpress){
    selection++;
    unpress=false;
  } else if (event.code === "ArrowLeft"&&menu&&unpress){
    selection--;
    unpress=false;
  } else {
    unpress=true;
  }
  }
</script>
</body>
</html>
